# Default host configuration: laptop with an optional headless output.
#
# Default wallpaper (more resolutions are available in /usr/share/backgrounds/sway/)
# output * bg /usr/share/backgrounds/sway/Sway_Wallpaper_Blue_1920x1080.png fill
output * bg /share/Pictures/wallpapers/current fill

output eDP-1 {
  position 0 0
  #bg /home/mycroft/share/Pictures/wp.jpeg fill
}

output HEADLESS-1 {
  resolution 1920x1200 position 1920 0
  bg "#220900" solid_color
  disable
}

#
# Example configuration:
#
#   output HDMI-A-1 resolution 1920x1080 position 1920,0
