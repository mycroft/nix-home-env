# relax: no wallpaper at all, and every output scaled at 1.5 except the docked
# Dells, which run at native scale.
output * {
  scale 1.5
}

# Two Dell U2520D side by side on top, laptop centred below them. The Dells are
# matched by serial because their connector names follow whichever dock port
# they are plugged into. Positions are logical: the Dells are 2560x1440 at 1,
# the laptop's 2880x1800 at 1.5 is 1920x1200.
set $top-left "Dell Inc. DELL U2520D 18V2923"
set $top-right "Dell Inc. DELL U2520D HV72923"

output $top-left {
  scale 1
  position 0 0
}

output $top-right {
  scale 1
  position 2560 0
}

output eDP-1 {
  position 1600 1440
}

# Docked keyboards (the HHKB shows up as several devices) get the same options
# as the built-in one.
input type:keyboard {
  xkb_layout us
  xkb_options caps:ctrl_modifier,compose:ralt,grp:win_space_toggle
}

workspace 1 output eDP-1
workspace 2 output $top-left
workspace 3 output $top-right
