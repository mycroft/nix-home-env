# glitter: four physical displays plus a virtual output used for streaming.
set $main DP-3
set $term-backup alacritty
set $menu "rofi -modes drun,run -show drun -theme Arc-Dark -l 5 -m $main"

# Far-left portrait display.
# Became far down
output HDMI-A-6 {
  resolution 1920x1080
  position 0 1080
  # transform 270
}

# Left portrait display.
# Became far up
output DP-4 {
  resolution 1920x1080
  position 0 0
  # transform 270
}

# Main ultrawide display.
output $main {
  resolution 3840x1600
  # position 2160 0
  position 1920 0
}

# Right portrait display.
output HDMI-A-5 {
  resolution 1920x1080
  # position 6000 0
  position 5760 0
  transform 270
}

output HEADLESS-1 {
  resolution 1920x1080 position 3120 260
  bg "#220900" solid_color
}

output * bg #000000 solid_color

input "1278:33:PFU_Limited_HHKB-Hybrid" {
  xkb_layout us
  xkb_options caps:ctrl_modifier,compose:ralt,grp:win_space_toggle
}

input "5426:193:Razer_Razer_Viper_V3_Pro" {
  accel_profile flat
  pointer_accel -0.5
}

# Keep the regular workspaces on the ultrawide and dedicate one workspace to
# each portrait display.
workspace 1 output $main
workspace 2 output $main
workspace 3 output $main
workspace 4 output $main
workspace 5 output $main
workspace 6 output $main
workspace 7 output $main
workspace 8 output $main
workspace 9 output $main
workspace 10 output $main
workspace 11 output $main
workspace 12 output HDMI-A-6
workspace 13 output DP-4
workspace 14 output HDMI-A-5

# Workspace 0 can move between the virtual output and the main display.
workspace 0 output HEADLESS-1
workspace 0 output $main

bindsym $mod+escape workspace number 0
bindsym $mod+Shift+escape move container to workspace number 0
bindsym $mod+backslash workspace number 13
bindsym $mod+Shift+backslash move container to workspace number 13

# The shared config uses grave for the scratchpad; glitter reserves it for the
# right-hand display's workspace instead.
unbindsym $mod+grave
unbindsym $mod+Shift+grave
bindsym $mod+grave workspace number 14
bindsym $mod+Shift+grave move container to workspace number 14

bindsym $mod+Shift+Return exec $term-backup
bindsym $mod+m exec $HOME/.local/bin/v-monitor

# The shared binding has already expanded its Wofi command by the time this
# host fragment is included, so replace it after setting glitter's Rofi menu.
unbindsym $mod+d
bindsym $mod+d exec $menu

exec swaymsg create_output && swaymsg output 'HEADLESS-1' toggle

assign [class="Spotify"] workspace number 12
